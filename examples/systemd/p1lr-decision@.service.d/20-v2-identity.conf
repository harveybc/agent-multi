# P1LR v2 identity pin for p1lr-decision@.service — applies to every seed
# instance on this host: the template is repointed WHOLESALE to the v2
# identity, so no legacy-path instance is left to restart by accident.
# GENERATED by tools/p1lr_identity_supervision.py materialize (WO4, finding
# AUD-GEN-20260815-250) — regenerate, never hand-edit: tests pin these bytes
# to the generator.
[Service]
# 1. Pinned IMMUTABLE runtime worktree (WP0): a restart derives the same
#    experiment identity as the live nohup workers.
WorkingDirectory=%h/Documents/GitHub/.runtime/agent-multi-p1lr-v2-924910fe
# 2. The v2 screen gate (screen identity 14e7ce82, SCREEN_VIABLE_REGION,
#    sealed collection), replacing the legacy cd823e2b gate of the base
#    template. ExecStartPre re-verifies it against the V2 contract.
Environment=P1LR_SCREEN_GATE=%h/.local/share/agent-multi/p1lr_v2_collections_20260815/screen_14e7ce82/screen_verdict.json
# 3. Identity-specific per-seed env (v2 contract path+sha, chain id,
#    CUDA UUID). The legacy p1lr_env binding is RESET, not shadowed.
EnvironmentFile=
EnvironmentFile=%h/.config/agent-multi/p1lr-v2/seed%i.env.conf
EnvironmentFile=-%h/.config/agent-multi/p1lr-decision@%i.env
# 4. Gates, in order:
#    (a) screen-gate verification bound to the V2 contract, run from the
#        pinned immutable runtime worktree;
#    (b) CONTROL-ARTIFACT VERIFICATION (finding AUD-GEN-20260816-261).
#        A restart admission gate must NOT be mutable checkout code, so
#        the lease gate is installed READ-ONLY under a CONTENT-ADDRESSED
#        control path whose directory name IS the sha256 of the manifest
#        that pins every member. This line re-derives both digests and
#        exits 4 — the never-retried refusal class — on drift or absence,
#        so the gate fails CLOSED. Changing the supervision implementation
#        changes this literal digest, i.e. changes this reviewed unit.
#    (c) the durable-transition LEASE gate itself — a unit whose chain
#        does not hold the ruling active transition refuses (exit 4,
#        never retried) BEFORE any training process exists.
ExecStartPre=
ExecStartPre=%h/Documents/GitHub/.runtime/agent-multi-p1lr-v2-924910fe/examples/systemd/p1lr_decision_gate_check.sh ${P1LR_SCREEN_GATE} ${P1LR_CONTRACT}
ExecStartPre=/bin/sh -c 'echo "702607949a8d670494a2a7258e4e7ab468dd55e290e606925a85f4543a52cbc8  %h/.local/lib/agent-multi/p1lr-control/702607949a8d670494a2a7258e4e7ab468dd55e290e606925a85f4543a52cbc8/CONTROL_MANIFEST.sha256" | /usr/bin/sha256sum --status -c - && cd %h/.local/lib/agent-multi/p1lr-control/702607949a8d670494a2a7258e4e7ab468dd55e290e606925a85f4543a52cbc8 && /usr/bin/sha256sum --status -c CONTROL_MANIFEST.sha256 || exit 4'
ExecStartPre=%h/anaconda3/envs/trading-stack/bin/python %h/.local/lib/agent-multi/p1lr-control/702607949a8d670494a2a7258e4e7ab468dd55e290e606925a85f4543a52cbc8/tools/p1lr_identity_supervision.py lease-gate --expected-chain-id ${P1LR_EXPECTED_CHAIN_ID} --experiment ${P1LR_EXPERIMENT} --mode decision
# 5. The v2 invocation itself — byte-compatible with the live nohup
#    workers (same relative contract path, same mode, same gate).
ExecStart=
ExecStart=%h/anaconda3/envs/trading-stack/bin/python tools/p1_difficulty_lr_factorial.py --seed %i --mode decision --contract ${P1LR_CONTRACT} --screen-gate ${P1LR_SCREEN_GATE}
